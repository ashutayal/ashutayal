<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Ashu Tayal — Data Science, Machine Learning, Data Visualization">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset=".5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="240" rx="18"/></clipPath>
  </defs>
  <style>
    .name { font: 700 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
    .sub  { font: 500 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; letter-spacing: 2px; }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    .d2 { animation-delay: .35s; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .w1 { animation: drift 14s ease-in-out infinite alternate; }
    .w2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <!-- subtle grid -->
    <g stroke="#ffffff" stroke-opacity=".04">
      <path d="M0 60H1200M0 120H1200M0 180H1200"/>
      <path d="M150 0V240M300 0V240M450 0V240M600 0V240M750 0V240M900 0V240M1050 0V240"/>
    </g>
    <!-- waves -->
    <path class="w1" fill="#38bdf8" fill-opacity=".10" d="M0 190 C150 160 300 220 450 190 S750 160 900 190 S1200 220 1350 190 V240 H0Z"/>
    <path class="w2" fill="#818cf8" fill-opacity=".10" d="M0 205 C200 230 350 175 550 205 S850 230 1050 205 S1300 180 1400 205 V240 H0Z"/>
  </g>
  <text x="600" y="112" text-anchor="middle" class="name fade">Ashu Tayal</text>
  <rect x="540" y="130" width="120" height="3" rx="1.5" fill="url(#accent)" class="fade d2"/>
  <text x="600" y="168" text-anchor="middle" class="sub fade d2">DATA SCIENCE  •  MACHINE LEARNING  •  DATA VISUALIZATION</text>
</svg>
